<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body class="bg-dark text-white">
    <nav id = "z" class="navbar navbar-expand-sm navbar-dark">
        <div class="container-fluid">
          <a id = "y" class="navbar-brand text-white navbar-item" href="/">Home</a>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active text-white navbar-item" href="{{ url_for('create') }}">Create</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active text-white navbar-item" href="{{ url_for('viewclassrooms') }}">Classrooms</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active text-white navbar-item" href="{{ url_for('students') }}">Student List</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active text-white navbar-item" href="{{ url_for('teachers') }}">Teacher List</a>
              </li>
            </ul>
          </div>
          <a id="toggle" class="btn btn-outline-primary me-2 navbar-item" href="#">Light mode</a>
          {% if current_user.is_authenticated %}
            <a class="btn btn-outline-success me-2 navbar-item" 
            href="{{ url_for('profile') }}">Profile</a>
            <a class="btn btn-outline-danger navbar-item" 
            href="{{ url_for('logout') }}">Logout</a>
          {% endif %}
          {% if not current_user.is_authenticated %}
            <a class="btn btn-outline-success me-2 navbar-item" 
            href="{{ url_for('login') }}">Login</a>
            <a class="btn btn-outline-danger navbar-item" 
            href="{{ url_for('signup') }}">Sign Up</a>
          {% endif %}
          
        </div>
    </nav>    
    <div style="display:inline-block;width:150px;position:fixed;bottom:5px;right:30px;padding:20px;">
    <h2 id = 'clock' style="color:rgb(241, 255, 255);">08:31:00</h2>
    </div>
    <script src = /static/script.js></script>
    <div id = "x" class="text-center text-white d-flex flex-column min-vh-100 justify-content-center">

        {% block content %}
        
        {% endblock %}
        
    </div>
    <script>
        const toggleButton = document.getElementById('toggle');
        const body = document.body;
        const text = document.getElementById('x');
        const navbars = Array.from(document.getElementsByClassName('nav-link active text-white navbar-item'));
        const navtitle = document.getElementById('y');
        const navitself = document.getElementById('z');
        const clok = document.getElementById('clock');

        toggleButton.addEventListener('click', (e) => {
            e.preventDefault();
            if (body.className === "bg-dark text-white") {
                body.className = "bg-light text-dark";
                toggleButton.textContent = "Dark Mode";
                text.className="text-center text-dark d-flex flex-column min-vh-100 justify-content-center"
                for (let element of navbars) {
                  element.className='nav-link active text-dark navbar-item';
                }
                navtitle.className="navbar-brand text-dark navbar-item";
                navitself.className="navbar navbar-expand-sm navbar-light";
                clok.style.color='rgb(14,0,0)';
            } else {
                body.className = "bg-dark text-white";
                toggleButton.textContent = "Light Mode";
                text.className="text-center text-white d-flex flex-column min-vh-100 justify-content-center"
                for (let element of navbars) {
                  element.className='nav-link active text-white navbar-item';
                }
                navtitle.className="navbar-brand text-white navbar-item";
                navitself.className="navbar navbar-expand-sm navbar-light";
                clok.style.color='rgb(241,255,255)';
            }
        });
    </script>
</body>
</html>
