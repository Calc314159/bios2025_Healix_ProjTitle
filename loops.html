<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops Page</title>
</head>
<body>
    
    {% extends "base.html" %}

    {% block content %}
    <h1 class="title is-1">Loop through a list of items below</h1>
    {% for item in itemlist %}
        <h4 class="title is-4">Item: {{ item }}</h4>
    {% endfor %}
    {% endblock %}

</body>
</html>
